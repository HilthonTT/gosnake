<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="gosnake icon">
  <title>gosnake</title>
  <defs>
    <linearGradient id="body" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset=".55" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="#0C1A13"/>
  <!-- An S-shaped snake with grid-style rounded turns -->
  <path d="M96 30H60a16 16 0 0 0 0 32h24a16 16 0 0 1 0 32H48" fill="none" stroke="url(#body)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head and eye -->
  <circle cx="46" cy="94" r="11" fill="#86EFAC"/>
  <circle cx="42" cy="90" r="2.75" fill="#052E16"/>
  <!-- Food pellet -->
  <circle cx="22" cy="94" r="6" fill="#FBBF24"/>
</svg>
