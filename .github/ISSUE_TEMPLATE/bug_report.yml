name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `gosnake play crazy`
        2. ...
  - type: input
    id: version
    attributes:
      label: gosnake version
      description: Output of `gosnake --version`
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: OS and terminal
      placeholder: Windows 11, Windows Terminal
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: If gosnake crashed, paste the path or contents of the JSON crash report it printed.
      render: json
